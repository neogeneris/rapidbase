<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidBase Query Browser</title>
    <!-- vis‑network -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; background: #f5f7fb; overflow: hidden; }
        .sidebar { width: 320px; min-width: 200px; max-width: 600px; background: #2c3e50; color: #ecf0f1; display: flex; flex-direction: column; overflow: hidden; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 10; position: relative; }
        .sidebar-content { flex: 1; overflow-y: auto; overflow-x: hidden; }
        .sidebar-resizer { position: absolute; top: 0; right: 0; bottom: 0; width: 5px; cursor: col-resize; background: transparent; z-index: 20; }
        .sidebar-resizer:hover, .sidebar-resizer.resizing { background: #1abc9c; }
        .sidebar-header { padding: 15px; background: #1a2a36; border-bottom: 1px solid #3d566e; }
        .sidebar-header h2 { font-size: 1.3rem; margin-bottom: 5px; }
        .connections-list { padding: 10px 0; border-bottom: 1px solid #3d566e; max-height: 200px; overflow-y: auto; }
        .connection-item { padding: 6px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .connection-item:hover { background: #3d566e; }
        .connection-item.active { background: #1abc9c; }
        .conn-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conn-delete { color: #e74c3c; font-weight: bold; cursor: pointer; padding: 0 5px; opacity: 0.7; }
        .conn-delete:hover { opacity: 1; }
        .btn-add { background: #1abc9c; border: none; color: white; padding: 6px 12px; margin: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; width: calc(100% - 20px); }
        .btn-add:hover { background: #16a085; }
        .database-list, .treeview { padding: 10px; }
        .database-item, .table-node { padding: 5px 10px; cursor: pointer; }
        .database-item:hover, .table-node:hover { background: #3d566e; border-radius: 4px; }
        .treeview ul { list-style: none; padding-left: 20px; }
        .caret { cursor: pointer; user-select: none; margin-right: 5px; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: white; }
        .tabs-header { display: flex; background: #f8f9fa; border-bottom: 1px solid #dee2e6; overflow-x: auto; }
        .tab { padding: 10px 16px; background: #e9ecef; border-right: 1px solid #dee2e6; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .tab.active { background: white; border-bottom: 2px solid #1abc9c; }
        .tab-close { font-size: 1.2rem; opacity: 0.6; }
        .tab-close:hover { opacity: 1; }
        .tab-pane { display: none; height: 100%; flex-direction: column; padding: 15px; overflow: hidden; }
        .tab-pane.active { display: flex; flex-direction: column; height: calc(100vh - 120px); }
        button { background: #1abc9c; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #95a5a6; cursor: default; }
.sql-run-btn {
    min-width: 130px;
    text-align: center;
    white-space: nowrap;
}
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #1abc9c; border-radius: 22px; transition: .3s; }
        .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .3s; }
        input:checked + .slider { background: #e74c3c; }
        input:checked + .slider::before { transform: translateX(22px); }

        .sql-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .sql-mode-label { font-size: 0.8rem; color: #888; white-space: nowrap; }
        .table-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; min-height: 24px; }
        .table-chip { background: #1abc9c; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 4px; }
        .chip-remove { cursor: pointer; opacity: 0.7; font-size: 0.7rem; }
        .chip-remove:hover { opacity: 1; }
        .rel-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; align-items: center; }
        .rel-bar-label { font-size: 0.75rem; color: #888; margin-right: 4px; white-space: nowrap; }
        .table-chip-to { background: #3498db; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; transition: background 0.2s; }
        .table-chip-to:hover { background: #2980b9; }
        .table-chip-from { background: #e67e22; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; transition: background 0.2s; }
        .table-chip-from:hover { background: #d35400; }
        .sql-editor { font-family: monospace; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; resize: vertical; min-height: 60px; max-height: 120px; background: #e9ecef; color: #333; font-size: 0.85rem; margin-bottom: 4px; width: 100%; }
        .sql-editor:not([readonly]) { background: white; }
        .sql-error { display: none; padding: 4px 8px; background: #fdeded; color: #e74c3c; border-radius: 4px; font-size: 0.8rem; margin-bottom: 4px; }
        .sql-debug { padding: 4px 8px; background: #fff3cd; color: #856404; border-radius: 4px; font-size: 0.7rem; margin-top: 4px; max-height: 60px; overflow: auto; font-family: monospace; white-space: pre-wrap; display: none; }
        .sql-run-btn { align-self: flex-start; padding: 8px 16px; }
        .sql-editor.drag-over { border-color: #1abc9c; background: #e8f8f5; box-shadow: 0 0 0 2px rgba(26,188,156,0.3); }

        .grid-container { display: flex; flex-direction: column; height: 100%; min-height: 300px; background: white; border: 1px solid #e9ecef; border-radius: 6px; overflow: hidden; }
        .grid-scroll-wrapper { flex: 1; overflow: auto; min-height: 0; }
        .grid-table { width: 100%; border-collapse: collapse; table-layout: auto; white-space: nowrap; }
        .grid-head { position: sticky; top: 0; z-index: 10; }
        .grid-head th { padding: 10px 12px; font-weight: 600; cursor: pointer; user-select: none; border-right: 1px solid #dee2e6; background: #f8f9fa; border-bottom: 2px solid #dee2e6; text-align: left; min-width: 120px; }
        .grid-head th:hover { background: #e9ecef; }
        .grid-head th[data-sort="asc"]::after { content: " ▲"; }
        .grid-head th[data-sort="desc"]::after { content: " ▼"; }
        .grid-body td { padding: 8px 12px; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid #eee; border-bottom: 1px solid #eee; min-width: 120px; max-width: 300px; }
        .grid-body tr:hover td { background: #f5f7fb; }
        .grid-controls { display: flex; gap: 10px; padding: 10px; background: #f8f9fa; border-bottom: 1px solid #dee2e6; align-items: center; }
        .grid-search { padding: 6px 12px; border: 1px solid #ced4da; border-radius: 4px; min-width: 200px; }
        .grid-footer { padding: 6px 12px; background: #f8f9fa; border-top: 1px solid #dee2e6; font-size: 0.8rem; color: #888; text-align: center; flex-shrink: 0; }
        .grid-loading, .grid-error, .grid-empty { padding: 20px; text-align: center; color: #666; }
        .grid-loading { display: none; color: #1abc9c; }
        .grid-error { display: none; color: #e74c3c; background: #fdf2f2; border-radius: 4px; margin: 10px; }
        .hidden { display: none; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 750px; max-width: 95%; border-radius: 8px; max-height: 85vh; overflow-y: auto; }
        .modal-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .modal-column { flex: 1; min-width: 200px; }
        .modal-content input, .modal-content select { width: 100%; padding: 8px; margin: 4px 0 12px 0; border: 1px solid #ccc; border-radius: 4px; }
        .modal-content label { font-weight: 600; color: #2c3e50; font-size: 0.9rem; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #e9ecef; }
        .error-message { color: #e74c3c; background: #fdeded; padding: 8px; border-radius: 4px; margin-top: 10px; }
        .success-message { color: #27ae60; background: #eafaf1; padding: 8px; border-radius: 4px; margin-top: 10px; }
        #schema-graph { border: 1px solid #e9ecef; border-radius: 6px; background: white; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header"><h2>📊 RapidBase</h2><p>Query Browser</p></div>
    <button class="btn-add" id="btn-add-connection">➕ Nueva conexión</button>
    <div class="sidebar-content">
        <div class="connections-list" id="connections-list">Cargando conexiones...</div>
        <div class="database-list" id="database-list"></div>
        <div class="treeview" id="treeview"></div>
    </div>
    <div class="sidebar-resizer" id="sidebar-resizer"></div>
</div>
<div class="main">
    <div class="tabs-header" id="tabs-header"></div>
    <div class="tab-content" id="tab-content"></div>
    <div id="schema-graph" style="flex:1; display:none; background:white;"></div>
</div>

<div id="modal-connection" class="modal">
    <div class="modal-content">
        <h3>Nueva conexión</h3>
        <div class="modal-grid">
            <div class="modal-column">
                <label>Tipo de base de datos</label>
                <select id="conn-driver"><option value="sqlite">SQLite</option><option value="mysql">MySQL</option><option value="pgsql">PostgreSQL</option></select>
                <div id="sqlite-file-field"><label>Ruta del archivo .sqlite</label><input type="text" id="conn-database" placeholder="/ruta/a/mi.db"></div>
                <div id="server-fields-col1" style="display:none;"><label>Host / IP</label><input type="text" id="conn-host" placeholder="localhost"><label>Puerto</label><input type="text" id="conn-port" placeholder="3306"></div>
            </div>
            <div class="modal-column">
                <label>Nombre de la conexión</label><input type="text" id="conn-name" placeholder="Mi Base de Datos">
                <div id="server-fields-col2" style="display:none;"><label>Base de datos</label><input type="text" id="conn-dbname" placeholder="nombre_bd"><label>Usuario</label><input type="text" id="conn-user" placeholder="root"><label>Contraseña</label><input type="password" id="conn-pass" placeholder="••••••"></div>
            </div>
        </div>
        <div class="modal-buttons"><button id="modal-test">Probar</button><button id="modal-accept" disabled>Aceptar</button><button id="modal-close">Cancelar</button></div>
        <div id="modal-message"></div>
    </div>
</div>

<script src="grid/GridBuilder.js"></script>
<script src="grid/Paginator.js"></script>
<script src="grid/APIDataGrid.js"></script>
<script src="grid/querybrowser-grid-component.js"></script>

<script>
let currentConnectionId = null, tabs = new Map(), nextTabId = 0;
let network = null;   // instancia de vis‑network

async function fetchJson(url, options = {}) {
    const r = await fetch(url, options);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json(); if (j.error) throw new Error(j.error); return j;
}

// ------------------- Grafo de esquema -------------------
function checkGraphVisibility() {
    const graphDiv = document.getElementById('schema-graph');
    if (!graphDiv) return;
    
    if (tabs.size === 0 && currentConnectionId) {
        document.getElementById('tabs-header').style.display = 'none';
        document.getElementById('tab-content').style.display = 'none';
        graphDiv.style.display = 'block';
        loadSchemaGraph();
    } else {
        graphDiv.style.display = 'none';
        document.getElementById('tabs-header').style.display = 'flex';
        document.getElementById('tab-content').style.display = '';
        if (network) {
            network.destroy();
            network = null;
            graphDiv.innerHTML = '';
        }
    }
}

async function loadSchemaGraph() {
    const container = document.getElementById('schema-graph');
    if (!currentConnectionId || !container) return;
    
    try {
        const resp = await fetch(`api.php?action=schema_graph&connectionId=${currentConnectionId}`);
        const data = await resp.json();
        if (!data.nodes || data.nodes.length === 0) {
            container.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">No hay relaciones disponibles</div>';
            return;
        }
        
        const maxDegree = Math.max(...data.nodes.map(n => 
            data.edges.filter(e => e.from === n.id || e.to === n.id).length
        ), 1);
        
        const nodes = data.nodes.map(n => {
            const degree = data.edges.filter(e => e.from === n.id || e.to === n.id).length;
            const intensity = Math.floor(200 - (degree / maxDegree) * 150);
            return { ...n, color: `rgb(${intensity},${intensity},255)` };
        });
        
        const edges = data.edges.map(e => ({
            ...e,
            arrows: 'to',
            color: { opacity: 0.4 }
        }));
        
        const networkData = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
        const options = {
            layout: { improvedLayout: true },
            physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -50 } },
            interaction: { hover: true, navigationButtons: true },
            nodes: { shape: 'box', font: { size: 12 } }
        };
        
        container.innerHTML = '';
        network = new vis.Network(container, networkData, options);
        network.on('click', function(params) {
            if (params.nodes.length > 0) {
                const tableName = params.nodes[0];
                openTab(tableName);
            }
        });
    } catch(e) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:#e74c3c;">Error al cargar el grafo</div>';
    }
}

// ------------------- Conexiones y UI -------------------
async function loadConnections() {
    try {
        const data = await fetchJson('api.php?action=list_connections');
        const c = document.getElementById('connections-list');
        if (!data.connections.length) { c.innerHTML = '<div style="padding:10px;">No hay conexiones guardadas.</div>'; return; }
        c.innerHTML = data.connections.map(x => `<div class="connection-item" data-id="${x[0]}"><span class="conn-name">📁 ${escapeHtml(x[1])}</span><span class="conn-delete" data-id="${x[0]}">✖</span></div>`).join('');
        c.querySelectorAll('.connection-item').forEach(el => el.addEventListener('click', e => {
            if (e.target.classList.contains('conn-delete')) { e.stopPropagation(); deleteConnection(+e.target.dataset.id); }
            else connectSavedConnection(+el.dataset.id);
        }));
    } catch(e) { document.getElementById('connections-list').innerHTML = `<div style="padding:10px;color:#e74c3c;">Error: ${e.message}</div>`; }
}

async function deleteConnection(id) { if (confirm('¿Eliminar?')) { await fetchJson(`api.php?action=remove_connection&id=${id}`); loadConnections(); } }
async function connectSavedConnection(id) {
    try {
        const f = new FormData(); f.append('connId', id);
        const d = await fetchJson('api.php?action=connect_saved', { method: 'POST', body: f });
        if (d.status === 'ok') { currentConnectionId = d.connectionId; document.querySelectorAll('.connection-item').forEach(el => el.classList.remove('active')); document.querySelector(`.connection-item[data-id="${id}"]`)?.classList.add('active'); await loadTables(); checkGraphVisibility(); }
    } catch(e) { alert('Error: ' + e.message); }
}

async function loadDatabases() {
    try {
        const d = await fetchJson('api.php?action=list_databases');
        const div = document.getElementById('database-list');
        if (!d.databases.length) { div.innerHTML = '<div style="padding:10px;">No hay archivos .sqlite</div>'; return; }
        div.innerHTML = '<div style="padding:5px 10px;font-weight:bold;">📂 Archivos SQLite</div>' + d.databases.map(db => `<div class="database-item" data-db="${escapeHtml(db)}">🗄️ ${escapeHtml(db)}</div>`).join('');
        div.querySelectorAll('.database-item').forEach(el => el.addEventListener('click', () => connectDatabaseFile(el.dataset.db)));
    } catch(e) { document.getElementById('database-list').innerHTML = `<div style="padding:10px;color:#e74c3c;">Error: ${e.message}</div>`; }
}

async function connectDatabaseFile(db) {
    try { const f = new FormData(); f.append('db', db); const d = await fetchJson('api.php?action=connect', { method: 'POST', body: f }); if (d.status === 'ok') { currentConnectionId = d.connectionId; await loadTables(); checkGraphVisibility(); } }
    catch(e) { alert('Error: ' + e.message); }
}

async function loadTables() {
    if (!currentConnectionId) return;
    try {
        const d = await fetchJson(`api.php?action=list_tables&connectionId=${currentConnectionId}`);
        const div = document.getElementById('treeview');
        if (!d.tables.length) { div.innerHTML = '<div style="padding:10px;">No hay tablas.</div>'; return; }
        div.innerHTML = '<ul><li><span class="caret">▼</span> 📁 Tablas<ul>' + d.tables.map(t => `<li class="table-node" draggable="true" data-table="${escapeHtml(t)}">📄 ${escapeHtml(t)}</li>`).join('') + '</ul></li></ul>';
        div.querySelectorAll('.table-node').forEach(el => {
            el.addEventListener('click', () => openTab(el.dataset.table));
            el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', JSON.stringify({type:'table',name:el.dataset.table})); });
        });
        const caret = div.querySelector('.caret'), childUl = caret?.parentElement.querySelector('ul');
        caret?.addEventListener('click', e => { e.stopPropagation(); childUl.style.display = childUl.style.display === 'none' ? '' : 'none'; caret.innerText = childUl.style.display === 'none' ? '▶' : '▼'; });
    } catch(e) { document.getElementById('treeview').innerHTML = `<div style="padding:10px;color:#e74c3c;">Error: ${e.message}</div>`; }
}

function openTab(tableName) {
    for (let [tid, t] of tabs) if (t.tableName === tableName && t.connectionId === currentConnectionId) { activateTab(tid); return; }
    const tabId = `tab_${nextTabId++}`;
    tabs.set(tabId, { tableName, connectionId: currentConnectionId, tables: [tableName], mode: 'navigate' });

    const btn = document.createElement('div'); btn.className = 'tab'; btn.dataset.tabId = tabId;
    btn.innerHTML = `<span>📋 ${escapeHtml(tableName)}</span><span class="tab-close">✖</span>`;
    btn.addEventListener('click', e => { if (e.target.classList.contains('tab-close')) closeTab(tabId); else activateTab(tabId); });
    document.getElementById('tabs-header').appendChild(btn);

    const pane = document.createElement('div'); pane.className = 'tab-pane'; pane.id = `pane_${tabId}`;
    pane.innerHTML = `
        <div class="sql-toolbar">
            <label class="switch"><input type="checkbox" id="mode_${tabId}"><span class="slider"></span></label>
            <span class="sql-mode-label" id="modelabel_${tabId}">Navegación</span>
        </div>
        <div class="table-chips" id="chips_from_${tabId}"></div>
        <div class="rel-bar" id="bar_to_${tabId}"><span class="rel-bar-label">belongsTo:</span></div>
        <div class="rel-bar" id="bar_from_${tabId}"><span class="rel-bar-label">hasMany:</span></div>
        <textarea class="sql-editor" id="sql_${tabId}" readonly rows="3"></textarea>
        <div class="sql-error" id="error_${tabId}" style="display:none;"></div>
        <button class="sql-run-btn" id="run_${tabId}" style="display:none;">▶ Ejecutar</button>
        <div class="grid-container" id="grid_${tabId}">
            <div class="grid-controls"></div>
            <div class="grid-scroll-wrapper"><table class="grid-table"><thead class="grid-head"></thead><tbody class="grid-body"></tbody></table></div>
            <div class="grid-loading">Cargando datos...</div><div class="grid-error"></div>
        </div>
        <div class="sql-debug" id="debug_${tabId}"></div>`;
    document.getElementById('tab-content').appendChild(pane);
    activateTab(tabId);

    const modeCheck = document.getElementById(`mode_${tabId}`);
    const sqlEditor = document.getElementById(`sql_${tabId}`);
    const runBtn = document.getElementById(`run_${tabId}`);
    const modeLabel = document.getElementById(`modelabel_${tabId}`);

    modeCheck.addEventListener('change', () => toggleMode(tabId));
    runBtn.addEventListener('click', () => executeTabSQL(tabId));
    sqlEditor.addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter' && modeCheck.checked) runBtn.click(); });

    sqlEditor.addEventListener('dragover', e => { if (modeCheck.checked) return; e.preventDefault(); sqlEditor.classList.add('drag-over'); });
    sqlEditor.addEventListener('dragleave', () => sqlEditor.classList.remove('drag-over'));
    sqlEditor.addEventListener('drop', async e => {
    e.preventDefault(); sqlEditor.classList.remove('drag-over');
    if (modeCheck.checked) return;
    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
    if (data.type === 'table') {
        const tab = tabs.get(tabId);
        if (tab.tables.includes(data.name)) return;

        // Verificar si hay relación con al menos una de las tablas actuales
        const r = await fetch(`api.php?action=related_tables&connectionId=${tab.connectionId}&tables=${encodeURIComponent(JSON.stringify(tab.tables))}`);
        const related = await r.json();
        const allRelated = [...(related.to || []), ...(related.from || [])];

        if (!allRelated.includes(data.name)) {
            document.getElementById(`error_${tabId}`).textContent = 
                `No hay relaciones entre las tablas seleccionadas y ${data.name}.`;
            document.getElementById(`error_${tabId}`).style.display = 'block';
            return;
        }

        tab.tables.push(data.name);
        updateTableChips(tabId);
        loadNavigateGrid(tabId);
    }
});

    updateTableChips(tabId);
    loadNavigateGrid(tabId);
    checkGraphVisibility();
}

function updateTableChips(tabId) {
    const tab = tabs.get(tabId);
    const fromContainer = document.getElementById(`chips_from_${tabId}`);
    if (!fromContainer) return;

    fromContainer.innerHTML = tab.tables.map((t, i) => 
        `<span class="table-chip" title="${escapeHtml(t)}">${escapeHtml(t)}${tab.tables.length > 1 ? `<span class="chip-remove" data-idx="${i}">✖</span>` : ''}</span>`
    ).join(' ');

    fromContainer.querySelectorAll('.chip-remove').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = parseInt(el.dataset.idx);
            tab.tables.splice(idx, 1);
            if (tab.tables.length === 0) tab.tables = [tab.tableName];
            updateTableChips(tabId);
            loadNavigateGrid(tabId);
        });
    });

    loadRelatedBars(tabId);
}

async function loadRelatedBars(tabId) {
    const tab = tabs.get(tabId);
    const barTo = document.getElementById(`bar_to_${tabId}`);
    const barFrom = document.getElementById(`bar_from_${tabId}`);
    if (!barTo && !barFrom) return;
    
    try {
        const r = await fetch(`api.php?action=related_tables&connectionId=${tab.connectionId}&tables=${encodeURIComponent(JSON.stringify(tab.tables))}`);
        const related = await r.json();
        
        if (barTo) {
            barTo.innerHTML = '<span class="rel-bar-label">belongsTo:</span>' + 
                (related.to || []).map(t => `<span class="table-chip-to" data-table="${escapeHtml(t)}" title="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join(' ');
            barTo.querySelectorAll('.table-chip-to').forEach(chip => {
                chip.addEventListener('click', () => {
                    if (!tab.tables.includes(chip.dataset.table)) {
                        tab.tables.push(chip.dataset.table);
                        updateTableChips(tabId);
                        loadNavigateGrid(tabId);
                    }
                });
            });
        }
        
        if (barFrom) {
            barFrom.innerHTML = '<span class="rel-bar-label">hasMany:</span>' + 
                (related.from || []).map(t => `<span class="table-chip-from" data-table="${escapeHtml(t)}" title="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join(' ');
            barFrom.querySelectorAll('.table-chip-from').forEach(chip => {
                chip.addEventListener('click', () => {
                    if (!tab.tables.includes(chip.dataset.table)) {
                        tab.tables.push(chip.dataset.table);
                        updateTableChips(tabId);
                        loadNavigateGrid(tabId);
                    }
                });
            });
        }
    } catch(e) {}
}

function toggleMode(tabId) {
    const tab = tabs.get(tabId);
    const check = document.getElementById(`mode_${tabId}`);
    const sqlEditor = document.getElementById(`sql_${tabId}`);
    const runBtn = document.getElementById(`run_${tabId}`);
    const modeLabel = document.getElementById(`modelabel_${tabId}`);

    if (check.checked) {
        tab.mode = 'edit';
        sqlEditor.readOnly = false;
        sqlEditor.style.background = 'white';
        runBtn.style.display = 'block';

    } else {

        sqlEditor.style.background = '#e9ecef';
        runBtn.style.display = 'none';

}

function loadNavigateGrid(tabId) {
    const tab = tabs.get(tabId);
    const gridContainer = `#grid_${tabId}`;
    const container = document.querySelector(gridContainer);
    container.querySelector('.grid-head').innerHTML = '';
    container.querySelector('.grid-body').innerHTML = '';
    document.getElementById(`error_${tabId}`).style.display = 'none';
    document.getElementById(`debug_${tabId}`).style.display = 'none';

    const grid = new APIDataGrid(gridContainer, 'api.php?action=grid_data', { mode: 'infinite', pageSize: 30 });
    grid.tabId = tabId;
    grid.connectionId = tab.connectionId;
    grid.tables = tab.tables;

    const origBuildParams = grid.buildParams.bind(grid);
    grid.buildParams = function() {
        const p = origBuildParams();
        p.set('connectionId', this.connectionId);
        if (this.tables.length === 1) {
            p.set('table', this.tables[0]);
        } else {
            p.set('table', JSON.stringify(this.tables));
        }
        return p;
    };

    grid.fetchData = async function() {
        if (this.isLoading) return;
        this.isLoading = true; this.showLoading(); this.hideError();
        try {
            const url = `${this.apiUrl.split('?')[0]}?${this.buildParams().toString()}`;
            const r = await fetch(url);
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const d = await r.json();
            if (d.error) throw new Error(d.error);

            const rows = d.data || [];
            const meta = d.columns && d.titles ? { columns: d.columns, titles: d.titles } : null;
            const duration = d.debug?.duration ? (Number(d.debug.duration) / 1000).toFixed(7) + 's' : 'N/A';
            this.footerContainer.innerHTML = `📄 Total: ${(d.total || rows.length).toLocaleString()} registros | ${d.columns ? d.columns.length : rows[0]?.length || 0} columnas | 📃 Página ${d.page || this.currentPage} de ${d.last_page || '?'} | ⏱️ ${duration}`;

            if (rows.length > 0) {
                if (this.currentPage === 1) this.render(rows, meta);
                else this.appendRows(rows);
                this.hasMore = rows.length === this.pageSize;
                if (!this.hasMore && this.scrollCleanup) { this.scrollCleanup(); this.scrollCleanup = null; }
            } else { this.hasMore = false; if (this.scrollCleanup) { this.scrollCleanup(); this.scrollCleanup = null; } }

            if (d.debug) {
                document.getElementById(`sql_${tabId}`).value = d.debug.sql || '';
                const debugEl = document.getElementById(`debug_${tabId}`);
                debugEl.textContent = `SQL: ${d.debug.sql}\nDuration: ${duration}`;
                debugEl.style.display = 'block';
            }
            document.getElementById(`error_${tabId}`).style.display = 'none';
        } catch(e) {
            document.getElementById(`error_${tabId}`).textContent = 'Error: ' + e.message;
            document.getElementById(`error_${tabId}`).style.display = 'block';
            const debugEl = document.getElementById(`debug_${tabId}`);
            debugEl.textContent = 'Error: ' + e.message;
            debugEl.style.display = 'block';
        } finally { this.isLoading = false; this.hideLoading(); }
    };

    grid.load();
}



// Función auxiliar para animar el botón con caracteres braille
function animateButton(button, promise) {
    const frames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
    let frame = 0;
    let animationId;

    const originalText = button.textContent;
    button.disabled = true;

    // Usamos requestAnimationFrame para que la animación fluya incluso durante carga pesada
    function step() {
        button.textContent = frames[frame] + ' Ejecutando...';
        frame = (frame + 1) % frames.length;
        animationId = requestAnimationFrame(step);
    }
    // Forzamos un repintado inicial
    requestAnimationFrame(() => {
        button.textContent = frames[0] + ' Ejecutando...';
        animationId = requestAnimationFrame(step);
    });

    // Devolvemos una promesa que maneja el resultado de la consulta y limpia la animación
    return new Promise((resolve, reject) => {
        promise.then(result => {
            cancelAnimationFrame(animationId);
            button.textContent = originalText;
            button.disabled = false;
            resolve(result);
        }).catch(err => {
            cancelAnimationFrame(animationId);
            button.textContent = originalText;
            button.disabled = false;
            reject(err);
        });
    });
}

// Dentro de executeTabSQL, reemplaza el bloque try/catch por esto:
async function executeTabSQL(tabId) {
    const sql = document.getElementById(`sql_${tabId}`).value.trim();
    if (!sql) return;
    const tab = tabs.get(tabId);
    const gridContainer = `#grid_${tabId}`;
    const container = document.querySelector(gridContainer);

    // Limpiar grid
    container.querySelector('.grid-head').innerHTML = '';
    container.querySelector('.grid-body').innerHTML = '';

    const f = new FormData();
    f.append('connectionId', tab.connectionId);
    f.append('sql', sql);

    const runBtn = document.getElementById(`run_${tabId}`);
    if (!runBtn) {
        alert('Error: Botón no encontrado');
        return;
    }

    try {
        // Envolvemos la consulta con la animación braille
        const r = await animateButton(
            runBtn,
            fetchJson('api.php?action=execute_query', { method: 'POST', body: f })
        );

        if (r.columns) {
            // SELECT / DESCRIBE / SHOW...
            const grid = new APIDataGrid(gridContainer, 'api.php?action=execute_query', { mode: 'pagination', pageSize: 100 });
            grid.fetchData = async function() {
                if (this.isLoading) return;
                this.isLoading = true; this.showLoading(); this.hideError();
                try {
                    this.render(r.rows, {
                        columns: r.columns,
                        titles: r.columns.map(c => c.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()))
                    });
                    this.hasMore = false;
                    this.footerContainer.innerHTML = `📄 Total: ${r.rows.length} registros | ${r.columns.length} columnas | ⏱️ ${r.elapsed || 0}s`;
                } catch(e) {
                    this.showError(e.message);
                } finally {
                    this.isLoading = false; this.hideLoading();
                }
            };
            grid.load();
        } else {
            // INSERT, UPDATE, DELETE...
            alert(`Filas afectadas: ${r.affected} | ⏱️ ${r.elapsed || 0}s`);
        }
    } catch (e) {
        alert('Error: ' + e.message);
    }
}




function activateTab(id) {
    document.querySelectorAll('.tab,.tab-pane').forEach(el => el.classList.remove('active'));
    document.querySelector(`.tab[data-tab-id="${id}"]`)?.classList.add('active');
    document.getElementById(`pane_${id}`)?.classList.add('active');
}

function closeTab(id) {
    document.querySelector(`.tab[data-tab-id="${id}"]`)?.remove();
    document.getElementById(`pane_${id}`)?.remove();
    tabs.delete(id);
    if (!tabs.size) { document.getElementById('tabs-header').innerHTML = ''; document.getElementById('tab-content').innerHTML = ''; }
    else activateTab(tabs.keys().next().value);
    checkGraphVisibility();
}

}
