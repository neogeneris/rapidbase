<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidBase Query Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            background: #f5f7fb;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            min-width: 200px;
            max-width: 600px;
            background: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 10;
            position: relative;
        }
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .sidebar-resizer {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 5px;
            cursor: col-resize;
            background-color: transparent;
            transition: background-color 0.2s;
            z-index: 20;
        }
        .sidebar-resizer:hover, .sidebar-resizer.resizing {
            background-color: #1abc9c;
        }
        .sidebar-header {
            padding: 15px;
            background: #1a2a36;
            border-bottom: 1px solid #3d566e;
        }
        .sidebar-header h2 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }
        .connections-list {
            padding: 10px 0;
            border-bottom: 1px solid #3d566e;
            max-height: 200px;
            overflow-y: auto;
        }
        .connection-item {
            padding: 6px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .connection-item:hover {
            background: #3d566e;
        }
        .connection-item.active {
            background: #1abc9c;
        }
        .conn-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conn-delete {
            color: #e74c3c;
            font-weight: bold;
            cursor: pointer;
            padding: 0 5px;
            opacity: 0.7;
        }
        .conn-delete:hover {
            opacity: 1;
        }
        .btn-add {
            background: #1abc9c;
            border: none;
            color: white;
            padding: 6px 12px;
            margin: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            width: calc(100% - 20px);
        }
        .btn-add:hover {
            background: #16a085;
        }
        .database-list, .treeview {
            padding: 10px;
        }
        .database-item, .table-node {
            padding: 5px 10px;
            cursor: pointer;
        }
        .database-item:hover, .table-node:hover {
            background: #3d566e;
            border-radius: 4px;
        }
        .treeview ul {
            list-style: none;
            padding-left: 20px;
        }
        .caret {
            cursor: pointer;
            user-select: none;
            margin-right: 5px;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: white;
        }
        .tabs-header {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            overflow-x: auto;
        }
        .tab {
            padding: 10px 16px;
            background: #e9ecef;
            border-right: 1px solid #dee2e6;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .tab.active {
            background: white;
            border-bottom: 2px solid #1abc9c;
        }
        .tab-close {
            font-size: 1.2rem;
            opacity: 0.6;
        }
        .tab-close:hover {
            opacity: 1;
        }
        .tab-pane {
            display: none;
            height: 100%;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
        }
        .tab-pane.active {
            display: flex;
        }
        .drop-zone {
            border: 2px dashed #ced4da;
            background: #f8f9fa;
            text-align: center;
            padding: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #6c757d;
        }
        .sql-editor {
            width: 100%;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            margin-bottom: 12px;
            resize: vertical;
        }
        .toolbar {
            margin-bottom: 12px;
        }
        button {
            background: #1abc9c;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        /* Estilos específicos para el Grid (modo scroll infinito) */
        .grid-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            overflow: hidden;
        }
        .grid-head {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .grid-header {
            flex: 1;
            padding: 10px 12px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            border-right: 1px solid #dee2e6;
            transition: background 0.2s;
        }
        .grid-header:hover {
            background: #e9ecef;
        }
        .grid-header[data-sort="asc"]::after {
            content: " ▲";
        }
        .grid-header[data-sort="desc"]::after {
            content: " ▼";
        }
        .grid-body {
            flex: 1;
            overflow-y: auto;
        }
        .grid-row {
            display: flex;
            border-bottom: 1px solid #eee;
            transition: background 0.15s;
        }
        .grid-row:hover {
            background: #f5f7fb;
        }
        .grid-item {
            flex: 1;
            padding: 8px 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border-right: 1px solid #eee;
        }
        .grid-controls {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            align-items: center;
        }
        .grid-search {
            padding: 6px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            min-width: 200px;
        }
        .grid-paginator {
            display: flex;
            gap: 5px;
            justify-content: center;
            padding: 10px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }
        .grid-paginator button {
            padding: 6px 12px;
            border: 1px solid #ced4da;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .grid-paginator button.active {
            background: #1abc9c;
            color: white;
            border-color: #1abc9c;
        }
        .grid-loading, .grid-error, .grid-empty {
            padding: 20px;
            text-align: center;
            color: #666;
        }
        .grid-loading {
            display: none;
            color: #1abc9c;
        }
        .grid-error {
            display: none;
            color: #e74c3c;
            background: #fdf2f2;
            border-radius: 4px;
            margin: 10px;
        }
        .hidden {
            display: none;
        }
        /* Modal compacto */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }
        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 20px;
            width: 750px;
            max-width: 95%;
            border-radius: 8px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .modal-column {
            flex: 1;
            min-width: 200px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 8px;
            margin: 4px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .modal-content label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9rem;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
        }
        .error-message {
            color: #e74c3c;
            background: #fdeded;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
        }
        .success-message {
            color: #27ae60;
            background: #eafaf1;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <h2>📊 RapidBase</h2>
        <p>Query Browser</p>
    </div>
    <button class="btn-add" id="btn-add-connection">➕ Nueva conexión</button>
    <div class="sidebar-content">
        <div class="connections-list" id="connections-list">
            Cargando conexiones...
        </div>
        <div class="database-list" id="database-list">
            <!-- Archivos SQLite locales -->
        </div>
        <div class="treeview" id="treeview"></div>
    </div>
    <div class="sidebar-resizer" id="sidebar-resizer"></div>
</div>
<div class="main">
    <div class="tabs-header" id="tabs-header"></div>
    <div class="tab-content" id="tab-content"></div>
</div>

<!-- Modal para nueva conexión -->
<div id="modal-connection" class="modal">
    <div class="modal-content">
        <h3>Nueva conexión</h3>
        <div class="modal-grid">
            <div class="modal-column">
                <label>Tipo de base de datos</label>
                <select id="conn-driver">
                    <option value="sqlite">SQLite</option>
                    <option value="mysql">MySQL</option>
                    <option value="pgsql">PostgreSQL</option>
                </select>
                <div id="sqlite-file-field">
                    <label>Ruta del archivo .sqlite</label>
                    <input type="text" id="conn-database" placeholder="/ruta/a/mi.db">
                </div>
                <div id="server-fields-col1" style="display:none;">
                    <label>Host / IP</label>
                    <input type="text" id="conn-host" placeholder="localhost">
                    <label>Puerto</label>
                    <input type="text" id="conn-port" placeholder="3306">
                </div>
            </div>
            <div class="modal-column">

                    <input type="text" id="conn-dbname" placeholder="nombre_bd">

        <div id="modal-message"></div>

</div>

<script>
    // -------------------------------
    // 1. GridBuilder (clase base)
    // -------------------------------
    class GridBuilder {
        constructor(containerSelector) {
            this.container = document.querySelector(containerSelector);
            if (!this.container) throw new Error("Container not found: " + containerSelector);
            this.headerTemplate = this.container.querySelector('.grid-head');
            this.rowTemplate = this.container.querySelector('.grid-row');
            this.bodyContainer = this.container.querySelector('.grid-body') || this.container;
            if (this.rowTemplate) this.rowTemplate.classList.add('hidden');
            this.currentMetadata = null;
            this.columns = [];
        }

        render(data, metadata = null) {
            this.currentMetadata = metadata;
            if (!data || data.length === 0) {
                this.bodyContainer.innerHTML = '<div class="grid-empty">No hay datos</div>';
                return;
            }
            const firstRow = data[0];
            const isNumericArray = Array.isArray(firstRow);
            if (isNumericArray) this.renderNumericMode(data, metadata);
            else this.renderAssociativeMode(data, metadata);
        }

        renderNumericMode(data, metadata = null) {
            if (metadata && metadata.columns && metadata.titles) {
                this.columns = metadata.columns;
                const headerHTML = metadata.titles.map((title, i) =>
                    `<div class="grid-header" data-column="${metadata.columns[i]}">${this.escapeHtml(title)}</div>`
                ).join('');
                if (this.headerTemplate) this.headerTemplate.innerHTML = headerHTML;
            } else {
                const colsCount = data[0].length;
                this.columns = Array.from({length: colsCount}, (_, i) => i.toString());
                const headerHTML = Array.from({length: colsCount}, (_, i) =>
                    `<div class="grid-header" data-column="${i}">Columna ${i}</div>`
                ).join('');
                if (this.headerTemplate) this.headerTemplate.innerHTML = headerHTML;
            }
            this.bodyContainer.innerHTML = '';
            data.forEach((row, rowIndex) => {
                let rowHTML = this.rowTemplate ? this.rowTemplate.innerHTML : '';
                if (!this.rowTemplate) {
                    rowHTML = Array.from({length: row.length}, (_, i) => `<div class="grid-item">{${i}}</div>`).join('');
                }
                row.forEach((value, colIndex) => {
                    const placeholder = new RegExp(`\\{${colIndex}\\}`, 'g');
                    rowHTML = rowHTML.replace(placeholder, this.escapeHtml(value));
                });
                this.bodyContainer.insertAdjacentHTML('beforeend',
                    `<div class="grid-row" data-row-index="${rowIndex}">${rowHTML}</div>`
                );
            });
        }

        renderAssociativeMode(data, metadata = null) {
            const keys = Object.keys(data[0]);
            this.columns = keys;
            if (metadata && metadata.columns && metadata.titles) {
                const headerHTML = metadata.titles.map((title, i) =>
                    `<div class="grid-header" data-column="${metadata.columns[i]}">${this.escapeHtml(title)}</div>`
                ).join('');
                if (this.headerTemplate) this.headerTemplate.innerHTML = headerHTML;
            } else if (this.headerTemplate && this.headerTemplate.querySelectorAll('.grid-header').length <= 1) {
                const headerHTML = keys.map(key => `<div class="grid-header" data-column="${key}">${this.formatKey(key)}</div>`).join('');
                this.headerTemplate.innerHTML = headerHTML;
            }
            this.bodyContainer.innerHTML = '';
            data.forEach((row, rowIndex) => {
                let rowHTML = this.rowTemplate ? this.rowTemplate.innerHTML : '';
                if (!this.rowTemplate) {
                    rowHTML = keys.map(key => `<div class="grid-item">{${key}}</div>`).join('');
                }
                Object.keys(row).forEach(key => {
                    const placeholder = new RegExp(`\\{${key}\\}`, 'g');
                    rowHTML = rowHTML.replace(placeholder, this.escapeHtml(row[key]));
                });
                this.bodyContainer.insertAdjacentHTML('beforeend',
                    `<div class="grid-row" data-row-index="${rowIndex}">${rowHTML}</div>`
                );
            });
        }

        formatKey(key) {
            return key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
        }

        escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        clear() {
            this.bodyContainer.innerHTML = '';
            if (this.headerTemplate) this.headerTemplate.innerHTML = '';
        }
    }

    // -------------------------------
    // 2. APIDataGrid (scroll infinito)
    // -------------------------------
    class APIDataGrid extends GridBuilder {
        constructor(containerSelector, apiUrl, options = {}) {
            super(containerSelector);
            this.apiUrl = apiUrl;
            this.mode = options.mode || 'pagination';
            this.currentPage = 1;
            this.offset = 0;
            this.sortField = null;
            this.sortOrder = 'asc';
            this.searchTerm = '';
            this.pageSize = options.pageSize || 20;
            this.hasMore = true;
            this.isLoading = false;
            this.filter = options.filter || {};
            this.controlsContainer = this.container.querySelector('.grid-controls');
            this.loadingIndicator = this.container.querySelector('.grid-loading');
            this.errorContainer = this.container.querySelector('.grid-error');
            this.addControls();
            if (this.mode === 'pagination') {
                const pagEl = this.container.querySelector('.grid-paginator');
                if (pagEl && typeof Paginator !== 'undefined') {
                    this.paginator = new Paginator(pagEl, (page) => {
                        this.currentPage = page;
                        this.offset = (page - 1) * this.pageSize;
                        this.fetchData();
                    });
                }
            }
            if (this.mode === 'infinite') this.enableInfiniteScroll();
            this.scrollCleanup = null;
        }

        addControls() {
            if (!this.controlsContainer) return;
            const searchInput = document.createElement('input');
            searchInput.type = 'text';
            searchInput.className = 'grid-search';
            searchInput.placeholder = 'Buscar...';
            let timeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    this.searchTerm = e.target.value;
                    this.resetAndFetch();
                }, 300);
            });
            this.controlsContainer.innerHTML = '';
            this.controlsContainer.appendChild(searchInput);
        }

        buildParams() {
            const params = new URLSearchParams();
            const urlParts = this.apiUrl.split('?');
            if (urlParts.length > 1) {
                const existing = new URLSearchParams(urlParts[1]);
                for (let [k, v] of existing) params.set(k, v);
            }
            params.set('offset', this.offset);
            params.set('limit', this.pageSize);
            if (this.sortField) {
                const prefix = this.sortOrder === 'desc' ? '-' : '';
                params.set('sort', `${prefix}${this.sortField}`);
            }
            if (this.searchTerm) params.set('search', this.searchTerm);
            if (Object.keys(this.filter).length) params.set('filter', JSON.stringify(this.filter));
            return params;
        }

        async fetchData() {
            if (this.isLoading) return;
            this.isLoading = true;
            this.showLoading();
            this.hideError();
            try {
                const params = this.buildParams();
                const urlBase = this.apiUrl.split('?')[0];
                const url = `${urlBase}?${params.toString()}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();
                if (this.mode === 'pagination') {
                    const gridData = result.data || [];
                    const meta = result.head || null;
                    this.render(gridData, meta);
                    if (this.paginator && result.page)
                        this.paginator.update(result.page.current, result.page.total);
                } else if (this.mode === 'infinite') {
                    const newRows = result.data || [];
                    const meta = result.head || null;
                    if (newRows.length > 0) {
                        if (this.offset === 0) this.render(newRows, meta);
                        else this.appendRows(newRows, meta);
                        this.hasMore = result.page ? result.page.current < result.page.total : false;
                        if (!this.hasMore && this.scrollCleanup) {
                            this.scrollCleanup();
                            this.scrollCleanup = null;
                        }
                    } else {
                        this.hasMore = false;
                        if (this.scrollCleanup) this.scrollCleanup();
                    }
                }
            } catch (err) {
                this.showError(err.message);
            } finally {
                this.isLoading = false;
                this.hideLoading();
            }
        }

        appendRows(data, metadata = null) {
            if (!data || data.length === 0) return;
            if (this.bodyContainer.querySelector('.grid-row') === null && metadata) {
                this.render(data, metadata);
                return;
            }
            const isNum = Array.isArray(data[0]);
            data.forEach((row, idx) => {
                let rowHTML = this.rowTemplate ? this.rowTemplate.innerHTML : '';
                if (!this.rowTemplate) {
                    const len = isNum ? row.length : Object.keys(row).length;
                    rowHTML = Array.from({length: len}, (_, i) => `<div class="grid-item">{${i}}</div>`).join('');
                }
                if (isNum) {
                    row.forEach((val, col) => {
                        const re = new RegExp(`\\{${col}\\}`, 'g');
                        rowHTML = rowHTML.replace(re, this.escapeHtml(val));
                    });
                } else {
                    Object.keys(row).forEach(k => {
                        const re = new RegExp(`\\{${k}\\}`, 'g');
                        rowHTML = rowHTML.replace(re, this.escapeHtml(row[k]));
                    });
                }
                this.bodyContainer.insertAdjacentHTML('beforeend',
                    `<div class="grid-row" data-row-index="${this.offset + idx}">${rowHTML}</div>`
                );
            });
        }

        enableInfiniteScroll() {
            const scrollContainer = this.bodyContainer;
            if (!scrollContainer) return;
            const onScroll = () => {
                if (!this.hasMore || this.isLoading) return;
                const { scrollTop, scrollHeight, clientHeight } = scrollContainer;
                if (scrollTop + clientHeight >= scrollHeight - 200) {
                    this.offset += this.pageSize;
                    this.fetchData();
                }
            };
            scrollContainer.addEventListener('scroll', onScroll);
            this.scrollCleanup = () => scrollContainer.removeEventListener('scroll', onScroll);
        }

        resetAndFetch() {
            this.currentPage = 1;
            this.offset = 0;
            this.hasMore = true;
            this.clear();
            this.fetchData();
        }

        sortBy(field) {
            if (this.sortField === field) this.sortOrder = this.sortOrder === 'asc' ? 'desc' : 'asc';
            else { this.sortField = field; this.sortOrder = 'asc'; }
            this.resetAndFetch();
        }

        setFilter(filter) { this.filter = filter; this.resetAndFetch(); }
        showLoading() { if (this.loadingIndicator) this.loadingIndicator.style.display = 'block'; }
        hideLoading() { if (this.loadingIndicator) this.loadingIndicator.style.display = 'none'; }
        showError(msg) { if (this.errorContainer) { this.errorContainer.textContent = `Error: ${msg}`; this.errorContainer.style.display = 'block'; } }
        hideError() { if (this.errorContainer) this.errorContainer.style.display = 'none'; }
        load() { this.fetchData(); }
    }

    // -------------------------------
    // 3. Clase QueryBrowserGrid (integración)
    // -------------------------------
    class QueryBrowserGrid {
        static createTableGrid(containerSelector, connectionId, table, options = {}) {
            const apiUrl = 'api.php?action=grid_data';
            const config = {
                mode: options.mode || 'infinite',
                pageSize: options.pageSize || 30,
                filter: options.filter || {}
            };
            const grid = new APIDataGrid(containerSelector, apiUrl, config);
            grid.connectionId = connectionId;
            grid.table = table;
            const orig = grid.buildParams.bind(grid);
            grid.buildParams = function() {
                const p = orig();
                p.set('connectionId', this.connectionId);
                p.set('table', this.table);
                return p;
            };
            grid.container.addEventListener('click', (e) => {
                const header = e.target.closest('.grid-header');
                if (header && header.dataset.column) grid.sortBy(header.dataset.column);
            });
            grid.load();
            return grid;
        }
        static destroy(grid) { if (grid && typeof grid.clear === 'function') grid.clear(); }
    }
    window.QueryBrowserGrid = QueryBrowserGrid;

    // -------------------------------
    // 4. Estado y lógica principal del QueryBrowser
    // -------------------------------
    let currentConnectionId = null;
    let tabs = new Map();
    let nextTabId = 0;

    async function fetchJson(url, options = {}) {
        const resp = await fetch(url, options);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
        const json = await resp.json();
        if (json.error) throw new Error(json.error);
        return json;
    }

    async function loadConnections() {
        try {
            const data = await fetchJson('api.php?action=list_connections');
            const conns = data.connections || [];
            const container = document.getElementById('connections-list');
            if (conns.length === 0) {
                container.innerHTML = '<div style="padding:10px;">No hay conexiones guardadas.</div>';
                return;
            }
            let html = '';
            conns.forEach(c => {
                html += `<div class="connection-item" data-id="${c.id}" data-name="${escapeHtml(c.name)}">
                            <span class="conn-name">📁 ${escapeHtml(c.name)}</span>
                            <span class="conn-delete" data-id="${c.id}">✖</span>
                         </div>`;
            });
            container.innerHTML = html;
            document.querySelectorAll('.connection-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.classList.contains('conn-delete')) {
                        e.stopPropagation();
                        deleteConnection(parseInt(e.target.dataset.id));
                    } else {
                        connectSavedConnection(parseInt(el.dataset.id));
                    }
                });
            });
        } catch(err) {
            document.getElementById('connections-list').innerHTML = `<div style="padding:10px;color:#e74c3c;">Error: ${err.message}</div>`;
        }
    }

    async function deleteConnection(id) {
        if (!confirm('¿Eliminar esta conexión?')) return;
        await fetchJson(`api.php?action=remove_connection&id=${id}`);
        loadConnections();
        if (currentConnectionId && currentConnectionId.startsWith('saved_') && parseInt(currentConnectionId.split('_')[1]) === id) {
            currentConnectionId = null;
            document.getElementById('database-list').innerHTML = '';
            document.getElementById('treeview').innerHTML = '<div style="padding:10px;">Selecciona una conexión</div>';
        }
    }

    async function connectSavedConnection(connId) {
        const formData = new FormData();
        formData.append('connId', connId);
        const data = await fetchJson('api.php?action=connect_saved', { method: 'POST', body: formData });
        if (data.status === 'ok') {
            currentConnectionId = data.connectionId;
            document.querySelectorAll('.connection-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.querySelector(`.connection-item[data-id="${connId}"]`);
            if (activeEl) activeEl.classList.add('active');
            await loadTables();
            document.getElementById('database-list').innerHTML = '<div style="padding:10px;">✅ Conectado a: ' + escapeHtml(activeEl?.querySelector('.conn-name')?.innerText || '') + '</div>';
        }
    }

    async function loadDatabases() {
        try {
            const data = await fetchJson('api.php?action=list_databases');
            const dbs = data.databases || [];
            const dbDiv = document.getElementById('database-list');
            if (dbs.length === 0) {
                dbDiv.innerHTML = '<div style="padding:10px;">No hay archivos .sqlite en /data</div>';
                return;
            }
            let html = '<div style="padding:5px 10px; font-weight:bold;">📂 Archivos SQLite</div>';
            dbs.forEach(db => html += `<div class="database-item" data-db="${escapeHtml(db)}">🗄️ ${escapeHtml(db)}</div>`);
            dbDiv.innerHTML = html;
            document.querySelectorAll('.database-item').forEach(el => {
                el.addEventListener('click', () => connectDatabaseFile(el.dataset.db));
            });
        } catch(err) {
            document.getElementById('database-list').innerHTML = `<div style="padding:10px;color:#e74c3c;">Error: ${err.message}</div>`;
        }
    }

    async function connectDatabaseFile(dbName) {
        const formData = new FormData();
        formData.append('db', dbName);
        const data = await fetchJson('api.php?action=connect', { method: 'POST', body: formData });
        if (data.status === 'ok') {
            currentConnectionId = data.connectionId;
            document.querySelectorAll('.connection-item').forEach(el => el.classList.remove('active'));
            await loadTables();
        }
    }

    async function loadTables() {
        if (!currentConnectionId) return;
        const data = await fetchJson(`api.php?action=list_tables&connectionId=${currentConnectionId}`);
        const tables = data.tables || [];
        const treeDiv = document.getElementById('treeview');
        if (tables.length === 0) {
            treeDiv.innerHTML = '<div style="padding:10px;">No hay tablas.</div>';
            return;
        }
        let html = '<ul><li><span class="caret">▼</span> 📁 Tablas<ul>';
        tables.forEach(table => {
            html += `<li class="table-node" draggable="true" data-table="${escapeHtml(table)}">📄 ${escapeHtml(table)}</li>`;
        });
        html += '</ul></li></ul>';
        treeDiv.innerHTML = html;
        document.querySelectorAll('.table-node').forEach(el => {
            el.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'table', name: el.dataset.table }));
            });
            el.addEventListener('click', () => openTab(el.dataset.table));
        });
        const caret = document.querySelector('.caret');
        if (caret) {
            const parent = caret.parentElement;
            const childUl = parent.querySelector('ul');
            caret.addEventListener('click', (e) => {
                e.stopPropagation();
                if (childUl.style.display === 'none') {
                    childUl.style.display = '';
                    caret.innerText = '▼';
                } else {
                    childUl.style.display = 'none';
                    caret.innerText = '▶';
                }
            });
        }
    }

    function openTab(tableName) {
        for (let [tid, t] of tabs) {
            if (t.tableName === tableName && t.connectionId === currentConnectionId) {
                activateTab(tid);
                return;
            }
        }
        const tabId = `tab_${nextTabId++}`;
        const defaultSql = `SELECT * FROM "${tableName}" LIMIT 100`;
        tabs.set(tabId, { tableName, connectionId: currentConnectionId, sql: defaultSql });
        // Header
        const tabButton = document.createElement('div');
        tabButton.className = 'tab';
        tabButton.dataset.tabId = tabId;
        tabButton.innerHTML = `<span>📋 ${escapeHtml(tableName)}</span><span class="tab-close">✖</span>`;
        tabButton.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-close')) closeTab(tabId);
            else activateTab(tabId);
        });
        document.getElementById('tabs-header').appendChild(tabButton);
        // Pane
        const pane = document.createElement('div');
        pane.className = 'tab-pane';
        pane.id = `pane_${tabId}`;
        pane.innerHTML = `
            <div class="drop-zone" data-tab-id="${tabId}">🎯 Arrastra otra tabla aquí para auto-join</div>
            <textarea id="sql_${tabId}" class="sql-editor" rows="3">${escapeHtml(defaultSql)}</textarea>
            <div class="toolbar"><button class="run-btn" data-tab-id="${tabId}">▶ Ejecutar</button></div>
            <div class="grid-container" id="grid_${tabId}">
                <div class="grid-controls"></div>
                <div class="grid-head"></div>
                <div class="grid-body"></div>
                <div class="grid-paginator"></div>
                <div class="grid-loading">Cargando datos...</div>
                <div class="grid-error"></div>
            </div>
        `;
        document.getElementById('tab-content').appendChild(pane);
        // Crear grid en modo infinite scroll
        const gridContainer = `#grid_${tabId}`;
        const grid = QueryBrowserGrid.createTableGrid(gridContainer, currentConnectionId, tableName, {
            mode: 'infinite',
            pageSize: 30
        });
        // Guardar referencia (opcional)
        pane.querySelector('.run-btn').addEventListener('click', () => executeQuery(tabId));
        const textarea = pane.querySelector('.sql-editor');
        textarea.addEventListener('input', () => {
            const tab = tabs.get(tabId);
            if (tab) tab.sql = textarea.value;
        });
        // Drop zone para auto-join
        const dropZone = pane.querySelector('.drop-zone');
        dropZone.addEventListener('dragover', e => e.preventDefault());
        dropZone.addEventListener('drop', async e => {
            e.preventDefault();
            const raw = e.dataTransfer.getData('text/plain');
            const dropped = JSON.parse(raw);
            if (dropped.type === 'table' && dropped.name !== tableName) {
                const formData = new FormData();
                formData.append('connectionId', currentConnectionId);
                formData.append('tables', JSON.stringify([tableName, dropped.name]));
                const resp = await fetchJson('api.php?action=auto_query', { method: 'POST', body: formData });
                if (resp.sql) {
                    textarea.value = resp.sql;
                    executeQuery(tabId);
                }
            }
        });
        activateTab(tabId);
        // No es necesario cargar datos manualmente, el grid lo hace solo
    }

    async function executeQuery(tabId) {
        // Función para consultas manuales (si se modifica el SQL)
        const pane = document.getElementById(`pane_${tabId}`);
        const sql = pane.querySelector('.sql-editor').value;
        const tabInfo = tabs.get(tabId);
        if (!tabInfo) return;
        const gridContainer = `#grid_${tabId}`;
        // Si el usuario ejecuta una consulta personalizada, podemos volver a crear el grid?
        // Por simplicidad, recargamos el grid con la nueva consulta.
        // Sin embargo, el grid está diseñado para trabajar con una tabla fija.
        // Mejor redirigir a un nuevo tab? O actualizar el grid.
        alert('La ejecución de consultas personalizadas requiere reconstruir el grid. Por ahora usa el explorador de tablas.');
    }

    function activateTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
        if (tab) tab.classList.add('active');
        const pane = document.getElementById(`pane_${tabId}`);
        if (pane) pane.classList.add('active');
    }

    function closeTab(tabId) {
        const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
        if (tab) tab.remove();
        const pane = document.getElementById(`pane_${tabId}`);
        if (pane) pane.remove();
        tabs.delete(tabId);
        if (tabs.size === 0) {
            document.getElementById('tabs-header').innerHTML = '';
            document.getElementById('tab-content').innerHTML = '';
        } else {
            const firstKey = tabs.keys().next().value;
            if (firstKey) activateTab(firstKey);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    // Modal de nueva conexión
    const modal = document.getElementById('modal-connection');
    const btnAdd = document.getElementById('btn-add-connection');
    const btnClose = document.getElementById('modal-close');
    const btnTest = document.getElementById('modal-test');
    const btnAccept = document.getElementById('modal-accept');
    const driverSelect = document.getElementById('conn-driver');
    const sqliteField = document.getElementById('sqlite-file-field');
    const serverCol1 = document.getElementById('server-fields-col1');
    const serverCol2 = document.getElementById('server-fields-col2');

    function toggleFields() {
        const isSQLite = driverSelect.value === 'sqlite';
        sqliteField.style.display = isSQLite ? 'block' : 'none';
        serverCol1.style.display = isSQLite ? 'none' : 'block';
        serverCol2.style.display = isSQLite ? 'none' : 'block';
        if (!isSQLite) {
            const port = driverSelect.value === 'mysql' ? '3306' : '5432';
            document.getElementById('conn-port').value = port;
        }
    }
    driverSelect.addEventListener('change', toggleFields);
    toggleFields();

    btnAdd.addEventListener('click', () => {
        modal.style.display = 'block';
        document.getElementById('modal-message').innerHTML = '';
        btnAccept.disabled = true;
        document.getElementById('conn-name').value = '';
        document.getElementById('conn-database').value = '';
        document.getElementById('conn-host').value = 'localhost';
        document.getElementById('conn-port').value = driverSelect.value === 'mysql' ? '3306' : '5432';
        document.getElementById('conn-dbname').value = '';
        document.getElementById('conn-user').value = '';
        document.getElementById('conn-pass').value = '';
    });
    btnClose.addEventListener('click', () => modal.style.display = 'none');
    window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

    btnTest.addEventListener('click', async () => {
        const connData = getConnectionData();
        if (!connData.name || !connData.database) {
            document.getElementById('modal-message').innerHTML = '<div class="error-message">Nombre y base de datos obligatorios</div>';
            return;
        }
        try {
            const resp = await fetchJson('api.php?action=test_connection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(connData)
            });
            if (resp.success) {
                document.getElementById('modal-message').innerHTML = '<div class="success-message">✅ Conexión exitosa</div>';
                btnAccept.disabled = false;
            } else {
                document.getElementById('modal-message').innerHTML = '<div class="error-message">❌ Falló la conexión</div>';
                btnAccept.disabled = true;
            }
        } catch(err) {
            document.getElementById('modal-message').innerHTML = `<div class="error-message">Error: ${err.message}</div>`;
            btnAccept.disabled = true;
        }
    });

    btnAccept.addEventListener('click', async () => {
        const connData = getConnectionData();
        try {
            await fetchJson('api.php?action=add_connection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(connData)
            });
            modal.style.display = 'none';
            loadConnections();
        } catch(err) {
            alert('Error al guardar: ' + err.message);
        }
    });

    function getConnectionData() {
        const driver = driverSelect.value;
        if (driver === 'sqlite') {
            return {
                name: document.getElementById('conn-name').value.trim(),
                driver: 'sqlite',
                database: document.getElementById('conn-database').value.trim(),
                username: '',
                password: ''
            };
        } else {
            return {
                name: document.getElementById('conn-name').value.trim(),
                driver: driver,
                host: document.getElementById('conn-host').value.trim(),
                port: parseInt(document.getElementById('conn-port').value) || (driver === 'mysql' ? 3306 : 5432),
                database: document.getElementById('conn-dbname').value.trim(),
                username: document.getElementById('conn-user').value.trim(),
                password: document.getElementById('conn-pass').value
            };
        }
    }

    // Inicialización
    loadConnections();
    loadDatabases();

    // Redimensionador sidebar
    const sidebar = document.querySelector('.sidebar');
    const resizer = document.getElementById('sidebar-resizer');
    if (sidebar && resizer) {
        let isResizing = false;
        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            resizer.classList.add('resizing');
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            let newWidth = e.clientX;
            if (newWidth < 200) newWidth = 200;
            if (newWidth > 600) newWidth = 600;
            sidebar.style.width = `${newWidth}px`;
        });
        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('resizing');
                document.body.style.cursor = 'default';
            }
        });
    }
</script>
</body>
</html>
