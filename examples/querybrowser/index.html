<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidBase Query Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            background: #f5f7fb;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .sidebar-header {
            padding: 15px;
            background: #1a2a36;
            border-bottom: 1px solid #3d566e;
        }
        .sidebar-header h2 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }
        .connections-list {
            padding: 10px 0;
            border-bottom: 1px solid #3d566e;
            max-height: 200px;
            overflow-y: auto;
        }
        .connection-item {
            padding: 6px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .connection-item:hover {
            background: #3d566e;
        }
        .connection-item.active {
            background: #1abc9c;
        }
        .conn-name {
            flex: 1;
        }
        .conn-delete {
            color: #e74c3c;
            font-weight: bold;
            cursor: pointer;
            padding: 0 5px;
            opacity: 0.7;
        }
        .conn-delete:hover {
            opacity: 1;
        }
        .btn-add {
            background: #1abc9c;
            border: none;
            color: white;
            padding: 6px 12px;
            margin: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-add:hover {
            background: #16a085;
        }
        .database-list, .treeview {
            padding: 10px;
        }
        .database-item, .table-node {
            padding: 5px 10px;
            cursor: pointer;
        }
        .database-item:hover, .table-node:hover {
            background: #3d566e;
            border-radius: 4px;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: white;
        }
        .tabs-header {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            overflow-x: auto;
        }
        .tab {
            padding: 10px 16px;
            background: #e9ecef;
            border-right: 1px solid #dee2e6;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .tab.active {
            background: white;
            border-bottom: 2px solid #1abc9c;
        }
        .tab-close {
            font-size: 1.2rem;
            opacity: 0.6;
        }
        .tab-close:hover {
            opacity: 1;
        }
        .tab-pane {
            display: none;
            height: 100%;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
        }
        .tab-pane.active {
            display: flex;
        }
        .drop-zone {
            border: 2px dashed #ced4da;
            background: #f8f9fa;
            text-align: center;
            padding: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
        }
        .sql-editor {
            width: 100%;
            font-family: monospace;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            margin-bottom: 12px;
            resize: vertical;
        }
        .toolbar {
            margin-bottom: 12px;
        }
        button {
            background: #1abc9c;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        .results-grid {
            flex: 1;
            overflow: auto;
            border: 1px solid #e9ecef;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 6px 8px;
            text-align: left;
        }
        th {
            background: #f8f9fa;
            position: sticky;
            top: 0;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }
        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 20px;
            width: 500px;
            border-radius: 8px;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }
        .error-message {
            color: #e74c3c;
            background: #fdeded;
            padding: 8px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <h2>📊 RapidBase</h2>
        <p>Query Browser</p>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <button class="btn-add" id="btn-add-connection">➕ Nueva conexión</button>
    </div>
    <div class="connections-list" id="connections-list">
        Cargando conexiones...
    </div>
    <div class="database-list" id="database-list">
        <!-- Se mostrarán las bases de datos una vez seleccionada una conexión -->
    </div>
    <div class="treeview" id="treeview"></div>
</div>
<div class="main">
    <div class="tabs-header" id="tabs-header"></div>
    <div class="tab-content" id="tab-content"></div>
</div>

<!-- Modal para nueva conexión -->
<div id="modal-connection" class="modal">
    <div class="modal-content">
        <h3>Nueva conexión</h3>
        <label>Nombre descriptivo</label>
        <input type="text" id="conn-name" placeholder="Mi Base de Datos">
        <label>Driver</label>
        <select id="conn-driver">
            <option value="sqlite">SQLite</option>
            <option value="mysql">MySQL</option>
            <option value="pgsql">PostgreSQL</option>
        </select>
        <div id="sqlite-fields">
            <label>Ruta del archivo .sqlite</label>
            <input type="text" id="conn-database" placeholder="C:/ruta/a/mi.db">
        </div>
        <div id="server-fields" style="display:none;">
            <label>Host</label>
            <input type="text" id="conn-host" placeholder="localhost">
            <label>Puerto</label>
            <input type="text" id="conn-port" placeholder="3306">
            <label>Base de datos</label>
            <input type="text" id="conn-dbname" placeholder="nombre_bd">
            <label>Usuario</label>
            <input type="text" id="conn-user">
            <label>Contraseña</label>
            <input type="password" id="conn-pass">
        </div>
        <div class="modal-buttons">
            <button id="modal-test">Probar</button>
            <button id="modal-accept" disabled>Aceptar</button>
            <button id="modal-close">Cancelar</button>
        </div>
        <div id="modal-message"></div>
    </div>
</div>

<script>
    // ---------- Estado ----------
    let currentConnectionId = null;
    let currentConnType = null; // 'file' o 'saved'
    let tabs = new Map();
    let nextTabId = 0;
    let connections = [];

    // ---------- Helpers ----------
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function fetchJson(url, options = {}) {
        const resp = await fetch(url, options);
        if (!resp.ok) {
            const text = await resp.text();
            throw new Error(`HTTP ${resp.status}: ${text}`);
        }
        return resp.json();
    }

    // ---------- Gestión de conexiones guardadas ----------
    async function loadConnections() {
        try {
            const data = await fetchJson('api.php?action=list_connections');
            connections = data.connections || [];
            const container = document.getElementById('connections-list');
            if (connections.length === 0) {
                container.innerHTML = '<div style="padding: 10px;">No hay conexiones guardadas.</div>';
                return;
            }
            let html = '';
            connections.forEach(conn => {
                html += `
                    <div class="connection-item" data-id="${conn.id}" data-name="${escapeHtml(conn.name)}">
                        <span class="conn-name">📁 ${escapeHtml(conn.name)}</span>
                        <span class="conn-delete" data-id="${conn.id}">✖</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            // Eventos
            document.querySelectorAll('.connection-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.classList.contains('conn-delete')) {
                        e.stopPropagation();
                        deleteConnection(parseInt(e.target.dataset.id));
                    } else {
                        const id = parseInt(el.dataset.id);
                        connectSavedConnection(id);
                    }
                });
            });
        } catch (err) {
            document.getElementById('connections-list').innerHTML = `<div style="padding:10px; color:#e74c3c;">Error: ${err.message}</div>`;
        }
    }

    async function deleteConnection(id) {
        if (!confirm('¿Eliminar esta conexión?')) return;
        await fetchJson(`api.php?action=remove_connection&id=${id}`);
        loadConnections();
        // Si la conexión eliminada era la activa, limpiar vista
        if (currentConnectionId && currentConnectionId.startsWith('saved_') && parseInt(currentConnectionId.split('_')[1]) === id) {
            currentConnectionId = null;
            document.getElementById('database-list').innerHTML = '';
            document.getElementById('treeview').innerHTML = '<div style="padding:10px;">Selecciona una conexión</div>';
        }
    }

    async function connectSavedConnection(connId) {
        try {
            const formData = new FormData();
            formData.append('connId', connId);
            const data = await fetchJson('api.php?action=connect_saved', { method: 'POST', body: formData });
            if (data.status === 'ok') {
                currentConnectionId = data.connectionId;
                currentConnType = 'saved';
                // Resaltar elemento activo
                document.querySelectorAll('.connection-item').forEach(el => el.classList.remove('active'));
                const activeEl = document.querySelector(`.connection-item[data-id="${connId}"]`);
                if (activeEl) activeEl.classList.add('active');
                // Cargar árbol de tablas
                await loadTables();
                // También podríamos listar bases de datos para SQLite (pero ya estamos dentro de una conexión)
                document.getElementById('database-list').innerHTML = '<div style="padding:10px;">Conectado a: ' + escapeHtml(activeEl?.querySelector('.conn-name')?.innerText || '') + '</div>';
            }
        } catch (err) {
            alert('Error al conectar: ' + err.message);
        }
    }

    // ---------- Conexión a archivo SQLite (demo) ----------
    async function loadDatabases() {
        try {
            const data = await fetchJson('api.php?action=list_databases');
            const dbs = data.databases || [];
            const dbDiv = document.getElementById('database-list');
            if (dbs.length === 0) {
                dbDiv.innerHTML = '<div style="padding: 10px;">No hay archivos .sqlite en /data</div>';
                return;
            }
            let html = '<div style="padding: 5px 10px; font-weight:bold;">📂 Archivos SQLite</div>';
            dbs.forEach(db => {
                html += `<div class="database-item" data-db="${escapeHtml(db)}">🗄️ ${escapeHtml(db)}</div>`;
            });
            dbDiv.innerHTML = html;
            document.querySelectorAll('.database-item').forEach(el => {
                el.addEventListener('click', () => connectDatabaseFile(el.dataset.db));
            });
        } catch (err) {
            document.getElementById('database-list').innerHTML = `<div style="padding:10px; color:#e74c3c;">Error: ${err.message}</div>`;
        }
    }

    async function connectDatabaseFile(dbName) {
        try {
            const formData = new FormData();
            formData.append('db', dbName);
            const data = await fetchJson('api.php?action=connect', { method: 'POST', body: formData });
            if (data.status === 'ok') {
                currentConnectionId = data.connectionId;
                currentConnType = 'file';
                // Limpiar resaltado de conexiones guardadas
                document.querySelectorAll('.connection-item').forEach(el => el.classList.remove('active'));
                await loadTables();
            }
        } catch (err) {
            alert('Error al conectar: ' + err.message);
        }
    }

    async function loadTables() {
        if (!currentConnectionId) return;
        try {
            const data = await fetchJson(`api.php?action=list_tables&connectionId=${currentConnectionId}`);
            const tables = data.tables || [];
            const treeDiv = document.getElementById('treeview');
            if (tables.length === 0) {
                treeDiv.innerHTML = '<div style="padding:10px;">No hay tablas.</div>';
                return;
            }
            let html = '<ul><li><span class="caret">▼</span> 📁 Tablas<ul>';
            tables.forEach(table => {
                html += `<li class="table-node" draggable="true" data-table="${escapeHtml(table)}">📄 ${escapeHtml(table)}</li>`;
            });
            html += '</ul></li></ul>';
            treeDiv.innerHTML = html;
            // Drag & drop
            document.querySelectorAll('.table-node').forEach(el => {
                el.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'table', name: el.dataset.table }));
                    e.dataTransfer.effectAllowed = 'copy';
                });
                el.addEventListener('click', () => openTab(el.dataset.table));
            });
            const caret = document.querySelector('.caret');
            if (caret) {
                const parent = caret.parentElement;
                const childUl = parent.querySelector('ul');
                caret.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (childUl.style.display === 'none') {
                        childUl.style.display = '';
                        caret.innerText = '▼';
                    } else {
                        childUl.style.display = 'none';
                        caret.innerText = '▶';
                    }
                });
            }
        } catch (err) {
            document.getElementById('treeview').innerHTML = `<div style="padding:10px; color:#e74c3c;">Error: ${err.message}</div>`;
        }
    }

    // ---------- Pestañas y queries ----------
    function openTab(tableName) {
        for (let [tid, t] of tabs.entries()) {
            if (t.tableName === tableName && t.connectionId === currentConnectionId) {
                activateTab(tid);
                return;
            }
        }
        const tabId = `tab_${nextTabId++}`;
        const defaultSql = `SELECT * FROM "${tableName}" LIMIT 100`;
        tabs.set(tabId, {
            tableName: tableName,
            connectionId: currentConnectionId,
            sql: defaultSql
        });
        // Header
        const tabButton = document.createElement('div');
        tabButton.className = 'tab';
        tabButton.dataset.tabId = tabId;
        tabButton.innerHTML = `<span>📋 ${escapeHtml(tableName)}</span><span class="tab-close">✖</span>`;
        tabButton.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-close')) {
                e.stopPropagation();
                closeTab(tabId);
            } else {
                activateTab(tabId);
            }
        });
        document.getElementById('tabs-header').appendChild(tabButton);
        // Pane
        const pane = document.createElement('div');
        pane.className = 'tab-pane';
        pane.id = `pane_${tabId}`;
        pane.innerHTML = `
            <div class="drop-zone" data-tab-id="${tabId}">🎯 Arrastra otra tabla aquí para auto-join</div>
            <textarea id="sql_${tabId}" class="sql-editor" rows="3">${escapeHtml(defaultSql)}</textarea>
            <div class="toolbar">
                <button class="run-btn" data-tab-id="${tabId}">▶ Ejecutar</button>
            </div>
            <div class="results-grid" id="grid_${tabId}">Esperando consulta...</div>
        `;
        document.getElementById('tab-content').appendChild(pane);
        // Drop zone
        const dropZone = pane.querySelector('.drop-zone');
        dropZone.addEventListener('dragover', e => e.preventDefault());
        dropZone.addEventListener('drop', async e => {
            e.preventDefault();
            const raw = e.dataTransfer.getData('text/plain');
            const dropped = JSON.parse(raw);
            if (dropped.type === 'table' && dropped.name !== tableName) {
                const formData = new FormData();
                formData.append('connectionId', currentConnectionId);
                formData.append('tables', JSON.stringify([tableName, dropped.name]));
                const resp = await fetchJson('api.php?action=auto_query', { method: 'POST', body: formData });
                if (resp.sql) {
                    const textarea = pane.querySelector('.sql-editor');
                    textarea.value = resp.sql;
                    executeQuery(tabId);
                }
            }
        });
        // Run button
        pane.querySelector('.run-btn').addEventListener('click', () => executeQuery(tabId));
        const textarea = pane.querySelector('.sql-editor');
        textarea.addEventListener('input', () => {
            const tab = tabs.get(tabId);
            if (tab) tab.sql = textarea.value;
        });
        activateTab(tabId);
        executeQuery(tabId);
    }

    async function executeQuery(tabId) {
        const pane = document.getElementById(`pane_${tabId}`);
        if (!pane) return;
        const sql = pane.querySelector('.sql-editor').value;
        const tabInfo = tabs.get(tabId);
        if (!tabInfo) return;
        const gridDiv = pane.querySelector('.results-grid');
        gridDiv.innerHTML = '<div>Ejecutando...</div>';
        try {
            const formData = new FormData();
            formData.append('connectionId', tabInfo.connectionId);
            formData.append('sql', sql);
            const data = await fetchJson('api.php?action=execute_query', { method: 'POST', body: formData });
            if (data.error) {
                gridDiv.innerHTML = `<div class="error-message">❌ ${escapeHtml(data.error)}</div>`;
                return;
            }
            if (!data.rows || data.rows.length === 0) {
                gridDiv.innerHTML = '<div>✔ Consulta ejecutada. Sin resultados.</div>';
                return;
            }
            let html = '</td><thead><tr>';
            data.columns.forEach(col => html += `<th>${escapeHtml(col)}</th>`);
            html += '</thead><tbody>';
            data.rows.forEach(row => {
                html += '<tr>';
                data.columns.forEach(col => {
                    let val = row[col];
                    if (val === null) val = 'NULL';
                    else if (typeof val === 'object') val = JSON.stringify(val);
                    html += `<td>${escapeHtml(String(val))}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            gridDiv.innerHTML = html;
        } catch (err) {
            gridDiv.innerHTML = `<div class="error-message">Error: ${escapeHtml(err.message)}</div>`;
        }
    }

    function activateTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
        if (tab) tab.classList.add('active');
        const pane = document.getElementById(`pane_${tabId}`);
        if (pane) pane.classList.add('active');
    }

    function closeTab(tabId) {
        const tab = document.querySelector(`.tab[data-tab-id="${tabId}"]`);
        if (tab) tab.remove();
        const pane = document.getElementById(`pane_${tabId}`);
        if (pane) pane.remove();
        tabs.delete(tabId);
        if (tabs.size === 0) {
            document.getElementById('tabs-header').innerHTML = '';
            document.getElementById('tab-content').innerHTML = '';
        } else {
            const firstKey = tabs.keys().next().value;
            if (firstKey) activateTab(firstKey);
        }
    }

    // ---------- Modal de nueva conexión ----------
    const modal = document.getElementById('modal-connection');
    const btnAdd = document.getElementById('btn-add-connection');
    const btnClose = document.getElementById('modal-close');
    const btnTest = document.getElementById('modal-test');
    const btnAccept = document.getElementById('modal-accept');
    const driverSelect = document.getElementById('conn-driver');
    const sqliteFields = document.getElementById('sqlite-fields');
    const serverFields = document.getElementById('server-fields');

    function toggleFields() {
        const driver = driverSelect.value;
        if (driver === 'sqlite') {
            sqliteFields.style.display = 'block';
            serverFields.style.display = 'none';
        } else {
            sqliteFields.style.display = 'none';
            serverFields.style.display = 'block';
        }
    }
    driverSelect.addEventListener('change', toggleFields);
    toggleFields();

    btnAdd.addEventListener('click', () => {
        modal.style.display = 'block';
        document.getElementById('modal-message').innerHTML = '';
        btnAccept.disabled = true;
        // limpiar campos
        document.getElementById('conn-name').value = '';
        document.getElementById('conn-database').value = '';
        document.getElementById('conn-host').value = 'localhost';
        document.getElementById('conn-port').value = driverSelect.value === 'mysql' ? '3306' : '5432';
        document.getElementById('conn-dbname').value = '';
        document.getElementById('conn-user').value = '';
        document.getElementById('conn-pass').value = '';
    });
    btnClose.addEventListener('click', () => modal.style.display = 'none');
    window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

    btnTest.addEventListener('click', async () => {
        const connData = getConnectionDataFromModal();
        if (!connData.name || !connData.database) {
            document.getElementById('modal-message').innerHTML = '<div class="error-message">Nombre y base de datos obligatorios</div>';
            return;
        }
        try {
            const resp = await fetchJson('api.php?action=test_connection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(connData)
            });
            if (resp.success) {
                document.getElementById('modal-message').innerHTML = '<div style="color:green;">✅ Conexión exitosa</div>';
                btnAccept.disabled = false;
            } else {
                document.getElementById('modal-message').innerHTML = '<div class="error-message">❌ Falló la conexión</div>';
                btnAccept.disabled = true;
            }
        } catch (err) {
            document.getElementById('modal-message').innerHTML = `<div class="error-message">Error: ${err.message}</div>`;
            btnAccept.disabled = true;
        }
    });

    btnAccept.addEventListener('click', async () => {
        const connData = getConnectionDataFromModal();
        try {
            await fetchJson('api.php?action=add_connection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(connData)
            });
            modal.style.display = 'none';
            loadConnections();
        } catch (err) {
            alert('Error al guardar: ' + err.message);
        }
    });

    function getConnectionDataFromModal() {
        const driver = driverSelect.value;
        if (driver === 'sqlite') {
            return {
                name: document.getElementById('conn-name').value.trim(),
                driver: 'sqlite',
                database: document.getElementById('conn-database').value.trim(),
                username: '',
                password: ''
            };
        } else {
            return {
                name: document.getElementById('conn-name').value.trim(),
                driver: driver,
                host: document.getElementById('conn-host').value.trim(),
                port: parseInt(document.getElementById('conn-port').value) || (driver === 'mysql' ? 3306 : 5432),
                database: document.getElementById('conn-dbname').value.trim(),
                username: document.getElementById('conn-user').value.trim(),
                password: document.getElementById('conn-pass').value
            };
        }
    }

    // Inicializar
    loadConnections();
    loadDatabases();
</script>
</body>
</html>
